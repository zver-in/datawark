version: v1alpha1
server:
  developmentPrincipal: local-dev
datasources:
  - name: analytics
    driver: postgres
    dsnEnv: DATAWARK_ANALYTICS_DSN
policies:
  - name: sales-read
    principals: [local-dev]
    datasource: missing
    allow:
      - table: sales.orders
        operations: [select]
        columns: [id]
