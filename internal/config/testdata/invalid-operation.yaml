version: v1alpha1
server:
  developmentPrincipal: local-dev
datasources:
  - name: analytics
    driver: postgres
    dsnEnv: DATAWARK_ANALYTICS_DSN
policies:
  - name: sales-write
    principals: [local-dev]
    datasource: analytics
    allow:
      - table: sales.orders
        operations: [update]
        columns: [id]
