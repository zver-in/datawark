version: v1alpha1

server:
  developmentPrincipal: local-dev
  runtime:
    statementTimeout: 5s
    maxRows: 1000
    maxResultBytes: 4194304
    maxConcurrentQueries: 16

datasources:
  - name: analytics
    driver: postgres
    dsnEnv: DATAWARK_ANALYTICS_DSN

policies:
  - name: sales-read
    principals: [local-dev]
    datasource: analytics
    allow:
      - table: sales.orders
        operations: [select]
        columns: [id, status, total, created_at]
