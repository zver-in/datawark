version: v1alpha1

server:
  developmentPrincipal: local-dev
  # Defaults to 127.0.0.1:8080; keep loopback until HTTP authentication is configured.
  http:
    listenAddress: 127.0.0.1:8080
    apiKeys:
      # Set DATAWARK_LOCAL_API_KEY in the server environment; no key belongs in YAML.
      - principal: local-dev
        keyEnv: DATAWARK_LOCAL_API_KEY
  runtime:
    statementTimeout: 5s
    maxRows: 1000
    maxResultBytes: 4194304
    maxConcurrentQueries: 16

datasources:
  - name: analytics
    driver: postgres
    dsnEnv: DATAWARK_ANALYTICS_DSN

policies:
  - name: sales-read
    principals: [local-dev]
    datasource: analytics
    allow:
      - table: sales.orders
        operations: [select]
        columns: [id, status, total, created_at]
