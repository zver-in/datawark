services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${DATAWARK_POSTGRES_SUPERUSER:?set DATAWARK_POSTGRES_SUPERUSER}
      POSTGRES_PASSWORD: ${DATAWARK_POSTGRES_SUPERUSER_PASSWORD:?set DATAWARK_POSTGRES_SUPERUSER_PASSWORD}
      POSTGRES_DB: ${DATAWARK_POSTGRES_DB:?set DATAWARK_POSTGRES_DB}
      DATAWARK_GATEWAY_DB_USER: ${DATAWARK_GATEWAY_DB_USER:?set DATAWARK_GATEWAY_DB_USER}
      DATAWARK_GATEWAY_DB_PASSWORD: ${DATAWARK_GATEWAY_DB_PASSWORD:?set DATAWARK_GATEWAY_DB_PASSWORD}
      DATAWARK_DEMO_OWNER: ${DATAWARK_DEMO_OWNER:?set DATAWARK_DEMO_OWNER}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./deploy/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 5s
      retries: 30

  gateway:
    build:
      context: .
    environment:
      DATAWARK_ANALYTICS_DSN: postgresql://${DATAWARK_GATEWAY_DB_USER:?set DATAWARK_GATEWAY_DB_USER}:${DATAWARK_GATEWAY_DB_PASSWORD:?set DATAWARK_GATEWAY_DB_PASSWORD}@postgres:5432/${DATAWARK_POSTGRES_DB:?set DATAWARK_POSTGRES_DB}?sslmode=disable
      DATAWARK_LOCAL_API_KEY: ${DATAWARK_LOCAL_API_KEY:?set DATAWARK_LOCAL_API_KEY}
    command: ["serve", "--config", "/etc/datawark/gateway.yaml"]
    volumes:
      - ./deploy/gateway.yaml:/etc/datawark/gateway.yaml:ro
    ports:
      - "127.0.0.1:${DATAWARK_GATEWAY_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/api/v1/ready"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  postgres-data:
