services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: datawark_test
      POSTGRES_PASSWORD: datawark_test
      POSTGRES_DB: datawark_test
    ports:
      - "127.0.0.1:54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U datawark_test -d datawark_test"]
      interval: 1s
      timeout: 5s
      retries: 30
